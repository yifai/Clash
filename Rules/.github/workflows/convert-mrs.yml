name: Convert Classical Ruleset to MRS

on:
  push:
    branches: [ main ] # 只要 main 分支有任何推送，立即转换
  schedule:
    - cron: '0 20 * * *' # 每天北京时间凌晨 4:00 (UTC 20:00) 自动定时更新
  workflow_dispatch: # 支持在 GitHub 页面上手动一键运行

jobs:
  convert-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予 Actions 推送代码回仓库的权限

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Latest Mihomo
        run: |
          # 动态获取 Mihomo 最新版本号并下载核心
          VERSION=$(curl -s https://github.com | grep tag_name | cut -d '"' -f 4)
          echo "Latest Mihomo version is $VERSION"
          curl -L -o mihomo.gz "https://github.com{VERSION}/mihomo-linux-amd64-${VERSION}.gz"
          gzip -d mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/

      - name: Process Rulesets (Classical Mode)
        run: |
          # 无论如何，先清空或创建全新的 output 目录，确保每次都是重新生成
          rm -rf output
          mkdir -p output
          
          # 检查 rules 目录是否存在且不为空
          if [ -d "rules" ] && [ "$(ls -A rules 2>/dev/null)" ]; then
            for f in rules/*.yaml rules/*.yml; do
              [ -e "$f" ] || continue
              filename=$(basename "$f" | sed 's/\.ya\?ml$//')
              echo "Forcing conversion for: $filename"
              
              # 强制进行转换
              mihomo convert-ruleset classical text "$f" "output/${filename}.mrs"
            done
          else
            echo "No YAML files found in rules/ directory."
            exit 1
          fi

      - name: Commit and Push MRS
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          # 无论内容有无实质变化，只要生成了文件就执行添加
          git add output/*.mrs
          
          # 如果内容完全一致导致 git commit 没有新提交，使用 || true 允许工作流正常通过不报错
          git commit -m "chore: force re-convert classical yaml to mrs [skip ci]" || echo "No actual content changes, skipping commit."
          git push || echo "No changes to push."
